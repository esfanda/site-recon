  page_harvest:
    enabled: true
    playwright: true
    screenshot: true
    max_pages: 60
    ttl_hours: 24

  tech_stack:
    enabled: true
    ttl_hours: 168

  traction:
    enabled: true
    tranco: true
    open_pagerank: false
